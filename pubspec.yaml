name: aura_box
description: >-
  Flutter widget for aura-style backgrounds: compose multiple blurred radial
  gradient spots inside a box to create soft, glowing, mesh-like gradients.
version: 1.1.0
homepage: https://lorenzogangemi.com
repository: https://github.com/GangemiLorenzo/aura_box
issue_tracker: https://github.com/GangemiLorenzo/aura_box/issues

topics:
  - gradient
  - blur
  - widget
  - ui
  - background

screenshots:
  - description: AuraBox examples with multiple blurred radial gradient spots.
    path: doc/aura_box_preview.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  patrol_finders: ^3.6.0
  very_good_analysis: ^11.0.0
